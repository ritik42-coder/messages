name: Build Messages APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "DIR=." >> $GITHUB_ENV
          else
            unzip -q "$(ls *.zip | head -n 1)" -d _project
            echo "DIR=_project" >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" Messages.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Messages-APK
          path: Messages.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Messages build ${{ github.run_number }}
          files: Messages.apk
